name: Bug report
description: Report a reproducible InKey problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please do not include private clipboard content, credentials or sensitive editor screenshots."
  - type: input
    id: version
    attributes:
      label: InKey version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and target editor
      placeholder: "macOS version, app name and version"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a short, non-sensitive sample. Include whether received-text verification is enabled.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
